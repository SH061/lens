<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 반 관리</title>
<style>
@font-face{font-family:Moneygraphy;src:url(/fonts/Moneygraphy-Rounded.woff2) format("woff2");font-display:swap}
:root{--ink:#1d1d1f;--mute:#6e6e73;--line:#d2d2d7;--parch:#f5f5f7;--blue:#0066cc}
*{box-sizing:border-box}body{margin:0;font-family:Moneygraphy,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:17px;line-height:1.47;color:var(--ink);background:var(--parch)}
.nav{height:48px;display:flex;align-items:center;padding:0 22px;background:#000c;color:#f5f5f7}.nav a{color:#2997ff;text-decoration:none;font-size:14px}
main{max-width:760px;margin:0 auto;padding:40px 16px 80px}
h1{font-size:34px;letter-spacing:-.025em;font-weight:400;margin:0 0 6px}.sub{color:var(--mute);margin:0 0 28px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px}
label{display:block;font-size:15px;color:var(--mute);margin:0 0 6px}
select{font:inherit;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink)}.row select{flex:1;min-width:0}
input,textarea{width:100%;font:inherit;padding:12px 16px;border:1px solid var(--line);border-radius:14px;outline:0;background:#fff;color:var(--ink)}input:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:260px;resize:vertical;line-height:1.6}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;border:0;border-radius:999px;padding:11px 24px;cursor:pointer;background:var(--blue);color:#fff;transition:transform .15s}button:active{transform:scale(.95)}button.g{background:#fff;color:var(--blue);border:1px solid var(--line)}
.msg{margin-top:12px;min-height:22px;font-size:15px;color:var(--mute)}.msg.ok{color:#1a7f37}.msg.bad{color:#c62828}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}th{color:var(--mute);font-size:14px}
.big{font-size:56px;letter-spacing:.12em;text-align:center;margin:6px 0 10px}.hint{font-size:15px;color:var(--mute);margin-top:8px}
</style></head><body>
<div class="nav"><a href="/">← 처음으로</a></div>
<main>
<h1>우리 반 관리</h1><p class="sub">한 번 등록하면 성적 돋보기를 비롯한 모든 도구가 같은 명단을 씁니다.</p>
<div class="card" id="rq" hidden><label>가입 신청 <b id="rn"></b></label><div id="rl"></div><div class="hint">학번과 이름이 우리 반 명단과 맞는지 확인하고 승인하세요. 모르는 학생이거나 이름이 명단과 다르면 거절하세요.</div></div>
<div class="card">
<label>담임 학급</label><div class="row" style="margin:0 0 18px"><select id="g"><option value="0">담임 아님</option><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option></select><select id="c"></select></div>
<label for="ta">학생 명단 — 한 줄에 한 명, 「학번 이름」</label>
<textarea id="ta" placeholder="10101 강건우&#10;10102 김하늘&#10;10103 이서준"></textarea>
<div class="hint">엑셀에서 학번·이름 두 열을 복사해 붙여 넣어도 됩니다. 이름만 적으면 위에서부터 1, 2, 3번으로 매겨요. 학번은 학년(1자리)+반(2자리)+번호(2자리)예요. 예: 1학년 1반 1번 → 10101</div>
<div class="row"><button id="sv">명단 저장</button><button class="g" id="rs">저장된 명단으로 되돌리기</button></div>
<div class="msg" id="msg"></div>
</div>
<div class="card"><label>저장된 우리 반 <b id="cnt"></b></label><table><thead><tr><th style="width:90px">학번</th><th>이름</th><th style="width:90px">가입</th><th style="width:80px"></th></tr></thead><tbody id="tb"></tbody></table><div class="hint" id="emp">아직 등록한 명단이 없습니다.</div></div>
</main>
<script>
function dlg(title,F,save){var d=document.createElement('dialog');d.style.cssText='border:1px solid var(--line,#d2d2d7);border-radius:22px;padding:26px;width:min(92vw,380px);background:var(--canvas,#fff);color:var(--ink,#1d1d1f);font:inherit';
var h=document.createElement('h3');h.textContent=title;h.style.cssText='margin:0 0 16px;font-size:22px;font-weight:400';d.append(h);var I={};
F.forEach(function(f){var l=document.createElement('label');l.textContent=f.label;l.style.cssText='display:block;font-size:14px;color:var(--mute,#6e6e73);margin:12px 0 4px';var e;
 if(f.opts){e=document.createElement('select');f.opts.forEach(function(o){var op=document.createElement('option');op.value=o[0];op.textContent=o[1];e.append(op)})}else{e=document.createElement('input');e.type=f.type||'text';e.placeholder=f.ph||'';e.autocomplete='off'}
 e.value=f.val==null?'':f.val;e.style.cssText='width:100%;padding:11px 16px;border:1px solid var(--line,#d2d2d7);border-radius:999px;font:inherit;background:var(--canvas,#fff);color:inherit;box-sizing:border-box';I[f.k]=e;d.append(l,e)});
var m=document.createElement('div');m.style.cssText='min-height:20px;margin-top:12px;font-size:14px;color:#c62828';d.append(m);
var r=document.createElement('div');r.style.cssText='display:flex;gap:8px;justify-content:flex-end;margin-top:6px';
function B(t,pri){var b=document.createElement('button');b.type='button';b.textContent=t;b.style.cssText='padding:10px 22px;border-radius:999px;font:inherit;cursor:pointer;border:1px solid var(--line,#d2d2d7);'+(pri?'background:var(--primary,var(--blue,#0066cc));color:#fff;border-color:transparent':'background:var(--canvas,#fff);color:inherit');return b}
var c=B('취소'),s=B('저장',1);c.onclick=function(){d.close()};d.addEventListener('close',function(){d.remove()});
s.onclick=async function(){var v={};for(var k in I)v[k]=I[k].value;s.disabled=true;var e=await save(v);s.disabled=false;if(e)m.textContent=e;else d.close()};
d.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();s.click()}});r.append(c,s);d.append(r);document.body.append(d);d.showModal();var f0=d.querySelector('input,select');if(f0)f0.focus()}
function stuSave(s,call){return async function(v){var b={no:s.no};v.name=v.name.trim();if(!v.name)return'이름을 적어 주세요.';if(v.name!==s.name)b.name=v.name;if(v.pw){if(!/^[\x21-\x7e]{6,30}$/.test(v.pw))return'비밀번호는 영문·숫자·기호 6자 이상이에요.';b.password=v.pw}
 if(v.no!==s.no){if(!/^[0-9]{5}$/.test(v.no))return'학번은 숫자 5자리예요. 예: 10101';b.g=+v.no[0];b.c=+v.no.slice(1,3);b.n=+v.no.slice(3)}
 var r=await fetch('/api/people/student',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});if(r.ok){call();return''}
 return r.status===409?'이미 있는 학번이에요.':r.status===403?'다른 반으로 옮기는 건 총괄관리자만 할 수 있어요.':r.status===400?'입력을 확인해 주세요(그 반 담임이 없으면 옮길 수 없어요).':'수정하지 못했어요.'}}
function stuEdit(s,call){dlg(s.name+' 학생 정보',[{k:'no',label:'학번 (학년1+반2+번호2자리)',val:s.no},{k:'name',label:'이름',val:s.name},{k:'pw',label:'새 비밀번호 (바꿀 때만, 6자 이상)',type:'password',ph:'비워 두면 그대로'}],stuSave(s,call))}
var $=function(s){return document.querySelector(s)},saved={cls:'',students:[]};
for(var i=1;i<=15;i++)$('#c').insertAdjacentHTML('beforeend','<option value="'+i+'">'+i+'반</option>');
function parse(t){var out=[],seen={};t.split(/\r?\n/).forEach(function(l){l=l.trim();if(!l)return;
  var p=l.split(/[\t,\s]+/).filter(Boolean),no='',name;
  if(p.length>1&&/^\d+$/.test(p[0])){no=p[0];name=p.slice(1).join(' ')}else name=p.join(' ');
  if(name)out.push({no:no,name:name})});
  out.forEach(function(x,i){if(!x.no)x.no=String(i+1)});return out}
function post(u,b){return fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})})}
function say(t,c){var m=$('#msg');m.textContent=t;m.className='msg '+(c||'')}
function btn(t,f,g){var b=document.createElement('button');b.textContent=t;b.style.cssText='padding:4px 12px;font-size:14px;margin-left:6px';if(g)b.className='g';b.onclick=f;return b}
function draw(){$('#tb').textContent='';saved.students.forEach(function(s){var tr=document.createElement('tr');
  [s.no,s.name,s.joined?'✓':'—'].forEach(function(t){var td=document.createElement('td');td.textContent=t;tr.append(td)});
  var td=document.createElement('td');td.append(btn('수정',function(){edit(s)},1));tr.append(td);$('#tb').append(tr)});
  var j=saved.students.filter(function(x){return x.joined}).length;$('#cnt').textContent=saved.students.length?'('+saved.students.length+'명, 가입 '+j+'명)':'';$('#emp').hidden=!!saved.students.length}
function edit(s){stuEdit(s,function(){say('수정했어요.','ok');load().then(fill)})}
function drawReq(L){$('#rq').hidden=!L.length;$('#rn').textContent=L.length?'('+L.length+')':'';$('#rl').textContent='';
  var tx={nohome:'이 반 담임이 없어 총괄관리자만 승인할 수 있어요',new:'명단에 없는 학번 — 승인하면 명단에 추가돼요',match:'명단과 일치해요',mismatch:'명단의 이름은 「'};
  L.forEach(function(r){var d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)';
   var t=document.createElement('div');t.innerHTML='<b></b> <span></span><div class="hint" style="margin:2px 0 0"></div>';t.children[0].textContent=r.no+' '+r.name;t.children[1].textContent=r.cls;
   t.children[2].textContent=r.state==='mismatch'?'명단의 이름은 「'+r.rosterName+'」이에요 — 다르면 승인할 수 없어요':tx[r.state];
   d.append(t);var bs=document.createElement('div');
   if(r.state!=='mismatch')bs.append(btn('승인',function(){post('/api/requests/approve',{no:r.no}).then(function(x){if(!x.ok)say('승인하지 못했어요.','bad');load().then(fill)})}));
   bs.append(btn('거절',function(){if(confirm(r.no+' '+r.name+' 신청을 거절할까요?'))post('/api/requests/reject',{no:r.no}).then(load)},1));d.append(bs);$('#rl').append(d)})}
function fill(){$('#g').value=saved.g||0;$('#c').value=saved.c||1;$('#ta').value=saved.students.map(function(s){return s.no+' '+s.name}).join('\n')}
function load(){return Promise.all([fetch('/api/roster'),fetch('/api/requests')]).then(function(rs){if(rs[0].status===401)return location.href='/';return Promise.all([rs[0].json(),rs[1].ok?rs[1].json():[]])}).then(function(d){if(!d)return;saved=d[0];draw();drawReq(d[1])}).catch(function(){say('서버에서 불러오지 못했습니다.','bad')})}
load().then(fill);
setInterval(function(){fetch('/api/requests').then(function(r){return r.ok?r.json():[]}).then(drawReq)},15000);
$('#rs').onclick=function(){fill();say('')};
$('#sv').onclick=function(){var st=parse($('#ta').value),names={},dup=[];
  st.forEach(function(x){if(names[x.name])dup.push(x.name);names[x.name]=1});
  if(dup.length&&!confirm('같은 이름이 있습니다: '+dup.join(', ')+'\n성적 파일의 이름으로 구분하므로 동명이인이 있으면 서로 섞일 수 있어요. 그래도 저장할까요?'))return;
  fetch('/api/roster',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({g:+$('#g').value,c:+$('#c').value,students:st})})
   .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(){load();say('저장했어요. '+st.length+'명이 모든 도구에 연동됩니다.','ok')})
   .catch(function(){say('저장하지 못했습니다(100명 이하만 저장돼요). 다시 시도해 주세요.','bad')})};
</script></body></html>
